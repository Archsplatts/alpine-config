## Bind
modkey 					= Mod4

bind[fullscreen_toggle] = MOD+f
bind[wind_del]          = MOD+q

program[alacritty]		= alacritty
bind[alacritty]   		= MOD+Return

program[alarms]			= ~/.rofi/scripts/alarm-window
bind[alarms]			= MOD+a

program[askbrave]		= flatpak run com.brave.Browser https://search.brave.com/ask
bind[askbrave]			= MOD+Shift+a

program[browser]		= flatpak run com.brave.Browser
bind[browser]			= XF86HomePage

program[calcurse]		= alacritty -e calcurse
bind[calcurse]			= MOD+Shift+c

program[config]			= ~/.rofi/scripts/config-menu
bind[config]			= MOD+c

program[discord]		= flatpak run com.discordapp.Discord
bind[discord]			= XF86Messenger

program[fastfetch]		= alacritty --hold fastfetch
bind[fastfetch]			= MOD+Shift+f

program[galculator] 	= galculator
bind[galculator]		= XF86Calculator

program[lollypop]		= lollypop
bind[lollypop]			= XF86Tools

program[menu]			= rofi -show drun -config ~/.config/rofi/gnome-menu.rasi
bind[menu]				= MOD+d

program[micro]			= alacritty -e micro
bind[micro]				= MOD+w

program[steam]			= flatpak run com.valvesoftware.Steam
bind[steam]				= MOD+Shift+s

program[thunar]			= thunar
bind[thunar]			= MOD+e

program[thunderbird]	= thunderbird
bind[thunderbird]		= XF86Mail

program[wallpaper]		= ~/.rofi/scripts/wallpaper-menu
bind[wallpaper]			= MOD+Shift+w

program[web-menu]		= ~/.rofi/scripts/web-menu
bind[web-menu]			= MOD+b

## Window Decoration
border_width = 3
region_padding = 0
tile_gap       = 8 

# Tiled
color_focus             = rgb:94/e2/d5   # Teal
color_focus_maximized   = rgb:94/e2/d5   # Teal
color_unfocus           = rgb:45/47/5a   # Surface1
color_unfocus_maximized = rgb:45/47/5a   # Surface1
color_urgent            = rgb:f3/8b/a8   # Red
color_urgent_maximized  = rgb:f3/8b/a8   # Red

# Floating (free)
color_focus_free             = rgb:94/e2/d5   # Teal
color_focus_maximized_free   = rgb:94/e2/d5   # Teal
color_unfocus_free           = rgb:45/47/5a   # Surface1
color_unfocus_maximized_free = rgb:45/47/5a   # Surface1
color_urgent_free            = rgb:f3/8b/a8   # Red
color_urgent_maximized_free  = rgb:f3/8b/a8   # Red

## Workspaces
workspace_limit = 3

bind[ws_1]   = MOD+ampersand
bind[ws_2]   = MOD+eacute
bind[ws_3]   = MOD+quotedbl

bind[mvws_1] = MOD+Shift+ampersand
bind[mvws_2] = MOD+Shift+eacute
bind[mvws_3] = MOD+Shift+quotedbl
